version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: utravel_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://root:rootpassword@db:3306/utravel_db
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - NODE_ENV=production
      - PORT=3000
      - EMAIL_FROM=noreply@utravel.com
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - db
    # If you want Prisma to automatically migrate the DB on start up, use this command:
    # command: sh -c "npx prisma migrate deploy && npm start"

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  db_data:
